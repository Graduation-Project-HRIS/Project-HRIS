<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/styles/css-files/home-css/home.css">
        <link rel="stylesheet" href="/styles/css-files/home-css/navber.css">
        <link rel="stylesheet"
            href="/styles/css-files/profile/leave-request.css">
        <title>Leave Form</title>
    </head>
    <body>
        <div class="home-container">
            <nav>
                <div class="left-nav">
                    <a class="active"
                        href="/frontend/html-files/home-html/home.html">Home</a>
                </div>
            </nav>
            <div class="welcome-message-leave">
                <h2>Submit Leave Request </h2>
            </div>
            <div id="submitMessageSuccess" class="top-notification" role="status"
                aria-live="polite"></div>

            <div id="submitMessageError" class="top-notification-error"
                role="status"
                aria-live="polite"></div>

            <div class="leave-form">
                <form id="leaveForm">

                    <div>
                        <label for="employeeId">Employee ID</label>
                        <input type="text" name="employeeId" id="employeeId"
                            maxlength="8" required>
                    </div>

                    <div id="employeeIdError" class="error-message"></div>

                    <div>
                        <label for="employeeName">Name</label>
                        <input type="text" name="employeeName" id="employeeName"
                            readonly required>
                    </div>

                    <div>
                        <label for="leaveType">Leave Type:</label>
                        <select id="leaveType" name="leaveType" required>
                            <option value>Choose leave type</option>
                            <option value="Annual Leave">Annual Leave (30
                                days)</option>
                            <option value="Sick Leave">Sick Leave</option>
                            <option value="Maternity Leave">Maternity Leave</option>
                            <option value="Study Leave">Study Leave</option>
                            <option value="Official Holiday Leave">Official Holiday Leave</option>
                        </select>
                    </div>

                    <div class="date-range-row">
                        <div>
                            <label for="startDate">Start Date:</label>
                            <input type="date" name="startDate" id="startDate"
                                required>
                        </div>

                        <div>
                            <label for="endDate">End Date:</label>
                            <input type="date" name="endDate" id="endDate"
                                required>
                        </div>
                    </div>

                    <div id="dateRangeError" class="error-message"></div>

                    <div>
                        <label for="details">Description:</label>
                        <textarea id="details" name="details" rows="4"
                            placeholder="Write the reason for your leave request..."
                            required></textarea>
                    </div>
                    <button type="submit" id="submitButton">Submit Request</button>
                </form>

            </div>

            <div class="page-tools">
                <a class="back-button"
                    href="/frontend/html-files/home-html/profile.html">Go
                    Back</a>
            </div>

        </div>
        <script src="/register-unregister-check.js"></script>
        <script
            src="/backend/script-files/profile/leave/leave-request.js"></script>
    </body>
</html>
