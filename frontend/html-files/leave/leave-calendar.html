<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Leave Calendar</title>
        <link rel="stylesheet"
            href="/styles/css-files/profile/leave-calendar.css" />
    </head>
    <body>

        <div class="calendar-wrapper">
            <div class="calendar-header">
                <button id="prevMonth">Previous</button>
                <h2 id="monthTitle"></h2>
                <button id="nextMonth">Next</button>
            </div>

            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div id="calendarDays" class="calendar-days"></div>
        </div>

        <div class="page-tools">
            <a class="back-button"
                href="/frontend/html-files/home-html/profile.html">Go Back</a>
        </div>

        <script
            src="/backend/script-files/profile/leave/leave-calendar.js"></script>
    </body>
</html>
