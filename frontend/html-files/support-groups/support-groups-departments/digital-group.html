<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/styles/css-files/home-css/home.css">
        <link rel="stylesheet" href="/styles/css-files/home-css/navber.css">
        <link rel="stylesheet" href="/styles/css-files/support-group/digital-group/digital.css">
        <title>Digital Group</title>
    </head>
    <body>
        <div class="home-container">
            <nav>
                <div class="left-nav">
                    <a class="active"
                        href="/frontend/html-files/index/index.html">Logout</a>
                    <a class="active"
                        href="/frontend/html-files/home-html/home.html">Home</a>
                </div>
            </nav>
            <nav>
                <div class="right-nav">
                    <a href="/frontend/html-files/home-html/profile.html">
                        <img src="/images/navbar/profile-icons.png"
                            alt="User Icon">
                    </a>
                </div>
            </nav>
            <div class="welcome-message">
                <h1>Welcome to the Digital Group Department</h1>
                <h2>Submit IT support requests and technical help tickets</h2>
            </div>

            <div class="digital-form">
                <form id="digital-form" action="#" method="post">
                    <label for="employee-id">Employee ID</label>
                    <input type="text" name="employee-id" id="employee-id" required>
                    <div id="employee-id-error" class="error-message"></div>

                    <label for="request-type">Request Type:</label>
                    <select name="request-type" id="request-type" required>
                        <option value="">Select a request type</option>
                        <option value="password-reset">Password Reset</option>
                        <option value="access-request">Access Request</option>
                        <option value="hardware">Hardware Request</option>
                        <option value="software">Software Request</option>
                        <option value="technical-issue">Technical Issue</option>
                        <option value="other">Other</option>
                    </select>

                    <label for="priority">Priority:</label>
                    <select name="priority" id="priority" required>
                        <option value="">Select priority level</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>

                    <label for="details">Description:</label>
                    <textarea id="details" name="details" rows="4"
                        placeholder="Describe your IT request or issue in detail..."
                        required></textarea>

                    <button type="submit" id="submitButton">Submit Request</button>
                </form>
            </div>

            <section class="contact-info">
                <h2>Digital Group Support</h2>
                <div class="info-item">
                    <span class="info-label">Help Desk Email:</span>
                    <span class="info-value">support@company.com</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Support Phone:</span>
                    <span class="info-value">+966 50 xxx xxxx</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Support Hours:</span>
                    <span class="info-value">8:00 AM - 5:00 PM (Sunday - Thursday)</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Average Response Time:</span>
                    <span class="info-value">2-4 hours</span>
                </div>
            </section>

            <div class="page-tools">
                <button id="backButton" type="button">Go Back</button>
            </div>
        </div>
        <script src="/backend/script-files/home-js/home.js"></script>
        <script src="/backend/script-files/support-group/digital-group/digital.js"></script>
    </body>
</html>
