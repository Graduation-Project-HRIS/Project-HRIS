<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/styles/css-files/home-css/home.css">
        <link rel="stylesheet" href="/styles/css-files/home-css/navber.css">
        <link rel="stylesheet"
            href="/styles/css-files/support-group/hr-css/hr-form.css">
        <title>HR Department</title>
    </head>
    <body>
        <div class="home-container">
            <nav>
                <div class="left-nav">
                    <a class="active"
                        href="/frontend/html-files/index/index.html">Logout</a>
                    <a class="active"
                        href="/frontend/html-files/home-html/home.html">Home</a>
                </div>
            </nav>
            <nav>
                <div class="right-nav">
                    <a href="/frontend/html-files/home-html/profile.html">
                        <img src="/images/navbar/profile-icons.png"
                            alt="User Icon">
                    </a>
                </div>
            </nav>
            <br>
            <div class="welcome-message">
                <h1>HR Department</h1>
                <h2>Use this form to submit your requests </h2>
            </div>
            <div id="submitMessageSuccess" class="top-notification"
                role="status"
                aria-live="polite"></div>

            <div id="submitMessageError" class="top-notification-error"></div>

            <div class="hr-form">
                <form id="hrForm"
                    action="/frontend/html-files/home-html/home.html"
                    method="get">
                    <label for="employeeIdInput">Employee ID</label>
                    <input type="text" name="employeeIdInput" id="employeeIdInput" maxlength="8"
                        required>
                    <div id="employeeIdError" class="error-message"></div>

                    <label for="employeeName">Employee Name</label>
                    <input type="text" name="employeeName" id="employeeName">

                    <label for="requestType">Request Type:</label>
                    <select name="requestType" id="requestType" required>
                        <option value></option>
                        <option value="Change Name">Change Name</option>
                        <option value="Change Phone Number">Change Phone
                            Number</option>
                        <option value="Change Email">Change Email</option>
                        <option value="Change Nationality">Change
                            Nationality</option>
                        <option value="Change Department">Change
                            Department</option>
                        <option value="Change Role">Change Role</option>
                    </select>

                    <label for="detailsInput">Details:</label>
                    <textarea id="detailsInput" name="detailsInput" rows="4"
                        placeholder="Provide more details about your request..."
                        required></textarea>

                    <button type="submit" id="submitButton">Submit
                        Request</button>
                </form>
            </div>
            <div class="page-tools">
                <a class="back-button"
                    href="/frontend/html-files/support-groups/support-groups-index/support-groups-departments.html">Go
                    Back</a>
            </div>
        </div>
        <script
            src="/backend/script-files/support-group/hr-group/hr-form.js"></script>
        <script src="/register-unregister-check.js"></script>
    </body>
</html>
