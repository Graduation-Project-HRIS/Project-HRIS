<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet"
            href="/styles/css-files/manager/employee-list.css">
        <title>employeesDB</title>
    </head>
    <body>
        <!-- Notification Toast -->
        <div id="notificationSuccess" class="toast-notification toast-success"
            role="status" aria-live="polite"></div>
        <div id="notificationError" class="toast-notification toast-error"
            role="status" aria-live="polite"></div>

        <h2 id="employeeListHead">Employees List</h2>
        <table class="employees-list">
            <thead>
                <tr>
                    <th>Number</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody"></tbody>
        </table>
        <a href="/frontend/html-files/manager/employess-adding.html">Add New
            Employee</a>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Edit Employee</h3>
                    <span class="modal-close"
                        onclick="closeEditModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <div class="form-group">
                            <label for="editEmployeeId">Employee ID </label>
                            <input type="text" id="editEmployeeId" readonly
                                disabled>
                        </div>
                        <div class="form-group">
                            <label for="editEmployeeName">Name</label>
                            <input type="text" id="editEmployeeName" required>
                        </div>
                        <div class="form-group">
                            <label for="editEmployeeEmail">Email</label>
                            <input type="email" id="editEmployeeEmail" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel"
                        onclick="closeEditModal()">Cancel</button>
                    <button type="button" class="btn-save"
                        onclick="saveEdit()">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- Delete Confirm Modal -->
        <div id="deleteModal" class="modal">
            <div class="modal-content modal-danger">
                <div class="modal-header">
                    <h3>Delete Employee</h3>
                    <span class="modal-close"
                        onclick="closeDeleteModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this employee? This
                        action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel"
                        onclick="closeDeleteModal()">Cancel</button>
                    <button type="button" class="btn-delete"
                        onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>

        <script src="/backend/script-files/db/edit/edit-employess.js"></script>
    </body>
</html>
