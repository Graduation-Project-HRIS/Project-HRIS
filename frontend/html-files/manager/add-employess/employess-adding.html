<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Employee IndexedDB</title>
        <link rel="stylesheet"
            href="/styles/css-files/manager/employee-form.css">
    </head>
    <body>
        <h1 class="e-form">Employee Form</h1>
        <div id="submitMessage" class="top-notification" role="status"
            aria-live="polite"></div>

        <div id="submitMessageError" class="top-notification-error"
            role="status"
            aria-live="polite"></div>

        <form id="employeeForm" class="body">
            <label for="employeeId">Employee ID:</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="employeeId"
                    placeholder="Employee ID (Generated)" readonly required
                    style="flex: 1;">
                <button type="button" id="generateId">Generate ID</button>
            </div>

            <div>
                <label for="employeeName">Employee Name:</label>
                <input type="text" id="employeeName" placeholder="Employee Name"
                    required>
            </div>

            <div>
                <label for="employeeEmail">Employee Email:</label>
                <input type="email" id="employeeEmail"
                    placeholder="Employee Email"
                    required>
            </div>
            <label for="employeeGender">Gender</label>

            <div class="radio-group">
                <div class="radio-option">

                    <input class="radio-input" type="radio" id="radioInputMale"
                        name="employeeGender" value="Male">
                    <label for="radioInputMale" class="radio-label">Male</label>
                </div>

                <div class="radio-option">
                    <input class="radio-input" type="radio"
                        id="radioInputFemale"
                        name="employeeGender" value="Female">
                    <label for="radioInputFemale"
                        class="radio-label">Female</label>
                </div>
            </div>

            <div>
                <label for="employeeInputNationality">Nationality:</label>
                <input type="text" id="employeeInputNationality"
                    placeholder="Employee Nationality"
                    required>
            </div>

            <div class="phone-input-wrapper">
                <label for="employeeInputPhoneNumber">Phone Number:</label>

                <div class="phone-row">
                    <span class="country-code">+965</span>
                    <input
                        type="tel"
                        id="employeeInputPhoneNumber"
                        class="phone-input"
                        placeholder="Enter Phone Number"
                        maxlength="8"
                        required>
                </div>
            </div>

            <div>
                <label for="departments">Departments:</label>
                <select name="departments" id="departments">
                    <option value="supportGroup"> Support Groups </option>
                    <option value="salesRevenue">Sales/Revenue-generating groups</option>
                    <option value="controlGroups">Control Groups</option>
                    <option value="executiveGroups">Executive Group</option>
                </select>
            </div>

            <div>
                <label for="roleOfUser">Select Role:</label>
                <select id="roleOfUser">
                    <option value="manager">Manager</option>
                    <option value="employee">Employee</option>
                </select>
            </div>

            <button type="submit" id="saveButton">Add Employee</button>
        </form>
        <div class="page-tools">
            <a class="back-button"
                href="/frontend/html-files/manager/index/manager-index.html">Go
                Back</a>
        </div>
        <script src="/backend/script-files/db/add/add-employess.js"></script>
        <script src="/register-unregister-check.js"></script>
        <!-- <script src="/sw.js"></script> -->
    </body>
</html>
