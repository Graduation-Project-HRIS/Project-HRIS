<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet"
            href="/styles/css-files/manager/employee-list.css">
        <title>EmployeesDB</title>
    </head>
    <body data-protected-page="true" data-allowed-roles="Manager">
        <!-- Notification Toast -->
        <div id="notificationSuccess" class="toast-notification toast-success"
            role="status" aria-live="polite"></div>
        <div id="notificationError" class="toast-notification toast-error"
            role="status" aria-live="polite"></div>

        <h2 class="employee-list-head">Employees List</h2>
        <input type="search" placeholder="Search by ID or Phone Number"
            class="search-bar" id="searchBar">
        <div class="table-wrapper">
            <table class="employees-list">
                <thead>
                    <tr>
                    <th>No.</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Gender</th>
                    <th>Nationality</th>
                    <th>Phone Number</th>
                    <th>Role</th>
                    <th>Department</th>
                    <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody"></tbody>
            </table>
        </div>
        </table>
        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Edit Employee</h3>
                    <span class="modal-close"
                        onclick="closeEditModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <div class="form-group">
                            <label for="editEmployeeId">Employee ID </label>
                            <input type="text" id="editEmployeeId" readonly
                                disabled>
                        </div>
                        <div class="form-group">
                            <label for="editEmployeeName">Name</label>
                            <input type="text" id="editEmployeeName" required>
                        </div>
                        <div class="form-group">
                            <label for="editEmployeeEmail">Email</label>
                            <input type="email" id="editEmployeeEmail" required>
                        </div>
                        <div class="form-group">
                            <label>Gender</label>

                            <div class="gender-options">
                                <label class="gender-option"
                                    for="editEmployeeGenderMale">
                                    <input type="radio"
                                        id="editEmployeeGenderMale"
                                        name="editEmployeeGender" value="Male">
                                    <span>Male</span>
                                </label>

                                <label class="gender-option"
                                    for="editEmployeeGenderFemale">
                                    <input type="radio"
                                        id="editEmployeeGenderFemale"
                                        name="editEmployeeGender"
                                        value="Female">
                                    <span>Female</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label
                                for="editEmployeeNationality">Nationality</label>
                            <input type="text" id="editEmployeeNationality"
                                required>
                        </div>
                        <div class="form-group">
                            <label
                                for="editEmployeePhoneNumber">Phone
                                Number</label>
                            <input type="text" id="editEmployeePhoneNumber"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="editEmployeeRole">Role</label>
                            <select id="editEmployeeRole" required>
                                <option value>Select role</option>
                                <option value="Manager">Manager</option>
                                <option value="Employee">Employee</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label
                                for="editEmployeeDepartment">Department</label>
                            <select id="editEmployeeDepartment" required>
                                <option value>Select department</option>
                                <option value="Support Groups">Support
                                    Groups</option>
                                <option
                                    value="Sales Revenue Groups">Sales/Revenue-generating
                                    groups</option>
                                <option value="Control Groups">Control
                                    Groups</option>
                                <option value="Executive Groups">Executive
                                    Groups</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel"
                        onclick="closeEditModal()">Cancel</button>
                    <button type="button" class="btn-save"
                        onclick="saveEdit()">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- Delete Confirm Modal -->
        <div id="deleteModal" class="modal">
            <div class="modal-content modal-danger">
                <div class="modal-header">
                    <h3>Delete Employee</h3>
                    <span class="modal-close"
                        onclick="closeDeleteModal()">&times;</span>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this employee? This
                        action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel"
                        onclick="closeDeleteModal()">Cancel</button>
                    <button type="button" class="btn-delete"
                        onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>

        <div class="page-tools">
            <a class="back-button"
                href="/frontend/html-files/manager/index/manager-index.html">Go
                Back</a>
        </div>
        <script src="/register-unregister-check.js"></script>
        <script src="/backend/script-files/db/records/fetch-data.js"></script>
        <script src="/backend/script-files/db/edit/edit-employess.js"></script>
        <script src="/backend/script-files/auth/role-ui.js"></script>
    </body>
</html>
