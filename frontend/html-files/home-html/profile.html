<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Employee Profile</title>
        <link rel="stylesheet" href="/styles/css-files/profile/profile.css">
    </head>
    <body>
        <div class="profile-shell">

            <nav class="profile-topbar">
                <div class="profile-topbar-links">
                    <a class="profile-topbar-link"
                        href="/frontend/html-files/home-html/home.html">Home</a>
                </div>
            </nav>

            <header class="profile-hero">
                <h1 class="profile-hero-title" id="profileWelcome"></h1>
            </header>

            <main class="profile-layout">
                <section class="profile-details-card">
                    <h2 class="profile-section-title">Employee Information</h2>

                    <div class="profile-details-grid">
                        <div class="profile-detail-item">
                            <span class="profile-detail-label">Name</span>
                            <span class="profile-detail-value"
                                id="profileName">Loading...</span>
                        </div>

                        <div class="profile-detail-item">
                            <span class="profile-detail-label">ID</span>
                            <span class="profile-detail-value"
                                id="profileId">Loading...</span>
                        </div>

                        <div class="profile-detail-item">
                            <span class="profile-detail-label">Role</span>
                            <span class="profile-detail-value"
                                id="profileRole">Loading...</span>
                        </div>

                        <div class="profile-detail-item">
                            <span class="profile-detail-label">Department</span>
                            <span class="profile-detail-value"
                                id="profileDepartment">Loading...</span>
                        </div>

                        <div
                            class="profile-detail-item profile-detail-item-full">
                            <span class="profile-detail-label">Email</span>
                            <span class="profile-detail-value"
                                id="profileEmail">Loading...</span>
                        </div>

                        <div
                            class="profile-detail-item profile-detail-item-full">
                            <span class="profile-detail-label">Phone
                                Number</span>
                            <span class="profile-detail-value"
                                id="profilePhoneNumber">Loading...</span>
                        </div>
                    </div>
                </section>

                <aside class="profile-actions-panel">
                    <h2 class="profile-section-title">Quick Actions</h2>

                    <a href="/frontend/html-files/leave/leave-form.html"
                        class="profile-action-tile">
                        <span class="profile-action-title">Leave Request</span>
                    </a>

                    <a href="/frontend/html-files/leave/leave-calendar.html"
                        class="profile-action-tile">
                        <span class="profile-action-title">Leave Calendar</span>
                    </a>

                </aside>
            </main>

            <div class="profile-bottom-tools">
                <a class="profile-back-link"
                    href="/frontend/html-files/home-html/home.html">Go Back</a>
            </div>

        </div>
        <script src="/register-unregister-check.js"></script>
        <script src="/sw.js"></script>
    </body>
    <script src="/register-unregister-check.js"></script>
    <script src="/backend/script-files/auth/role-ui.js"></script>
    <script src="/sw.js"></script>
</html>
